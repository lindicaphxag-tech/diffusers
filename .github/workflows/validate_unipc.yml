name: Validate UniPC scheduler fix

on:
  push:
    branches:
      - ci/unipc-default-dtype

jobs:
  unipc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,torch]"
      - name: Run UniPC scheduler tests
        run: pytest -q tests/schedulers/test_scheduler_unipc.py
